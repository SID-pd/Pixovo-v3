name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov ruff

      - name: Lint
        working-directory: backend
        # Non-blocking for now: the pre-existing codebase has not been linted.
        # Tighten to a failing gate once the backlog is cleared.
        run: ruff check app tests --output-format=github || true

      - name: Tests
        working-directory: backend
        # Storage and DB are redirected to a temp dir by tests/conftest.py, so
        # nothing here can touch a real uploads tree.
        run: |
          pytest tests/ -v --tb=short \
            --cov=app --cov-report=term-missing --cov-report=xml \
            --ignore=tests/load

      - name: Coverage floors on the load-critical modules
        working-directory: backend
        # These are the modules whose silent breakage produces a wrong photobook
        # rather than an error, so they carry a higher bar than the project mean.
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET

          FLOORS = {
              "app/engine/dsa_solver.py": 60.0,
              "app/db/session_store.py": 70.0,
              "app/engine/cover_selector.py": 85.0,
          }
          root = ET.parse("coverage.xml").getroot()
          rates = {}
          for cls in root.iter("class"):
              fn = cls.get("filename", "").replace("\\", "/")
              rates[fn] = float(cls.get("line-rate", 0)) * 100.0

          failed = False
          for path, floor in FLOORS.items():
              actual = rates.get(path)
              if actual is None:
                  print(f"::warning::{path} not present in coverage report")
                  continue
              status = "ok" if actual >= floor else "FAIL"
              print(f"{status:4} {path}: {actual:.1f}% (floor {floor:.0f}%)")
              if actual < floor:
                  failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      # Frontend test tooling (Vitest) arrives in Stage 2.1; see
      # docs/plans/M2-2.1-worker-downsampling.md. Until then the build is the gate.

  load-smoke:
    name: Load smoke (4 users x 60 photos)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The full 20x1000 gate is run manually on real hardware — a shared CI
    # runner cannot produce a meaningful capacity number. This smoke run only
    # proves the harness works and the pipeline survives concurrency.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psutil

      - name: Run load smoke
        working-directory: backend
        run: python -m tests.load.run_load_test --quick
